services:
  db:
    image: pgvector/pgvector:pg16
    container_name: food-finder-db
    environment:
      POSTGRES_USER: foodfinder
      POSTGRES_PASSWORD: foodfinder
      POSTGRES_DB: foodfinder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodfinder"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
